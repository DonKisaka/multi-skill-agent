<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Daily Agent</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; }

        header { background: #1e293b; padding: 16px 24px; border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 12px; }
        header h1 { font-size: 18px; font-weight: 600; color: #f1f5f9; }
        header .badge { font-size: 11px; background: #1d4ed8; color: #bfdbfe; padding: 3px 8px; border-radius: 12px; font-weight: 500; }

        .main { display: flex; flex: 1; overflow: hidden; gap: 1px; background: #334155; }

        .chat-panel { flex: 1; display: flex; flex-direction: column; background: #0f172a; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }

        .message { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.6; }
        .message.user { align-self: flex-end; background: #3b82f6; color: white; border-radius: 12px 12px 4px 12px; }
        .message.agent { align-self: flex-start; background: #1e293b; color: #e2e8f0; border-radius: 12px 12px 12px 4px; white-space: pre-wrap; }

        .input-area { padding: 16px; background: #1e293b; border-top: 1px solid #334155; display: flex; flex-direction: column; gap: 8px; }
        .session-row { display: flex; align-items: center; gap: 8px; }
        .session-row label { font-size: 12px; color: #64748b; }
        .session-input { background: #0f172a; border: 1px solid #334155; color: #e2e8f0; border-radius: 6px; padding: 4px 10px; font-size: 12px; width: 200px; outline: none; }
        .message-row { display: flex; gap: 8px; }
        .message-input { flex: 1; background: #0f172a; border: 1px solid #334155; color: #e2e8f0; border-radius: 8px; padding: 10px 14px; font-size: 14px; outline: none; }
        .message-input:focus { border-color: #3b82f6; }
        .send-btn { background: #3b82f6; color: white; border: none; border-radius: 8px; padding: 10px 20px; font-size: 14px; cursor: pointer; font-weight: 500; transition: background 0.15s; }
        .send-btn:hover { background: #2563eb; }
        .send-btn:disabled { background: #334155; cursor: not-allowed; }

        .standup-panel { width: 340px; background: #0f172a; display: flex; flex-direction: column; }
        .standup-header { padding: 14px 20px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .standup-header h2 { font-size: 14px; font-weight: 600; color: #f1f5f9; }
        .refresh-btn { background: none; border: 1px solid #334155; color: #94a3b8; border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
        .refresh-btn:hover { border-color: #3b82f6; color: #3b82f6; }
        .standup-list { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .standup-card { background: #1e293b; border-radius: 8px; padding: 14px; border: 1px solid #334155; }
        .standup-card .date { font-size: 11px; color: #64748b; margin-bottom: 8px; }
        .standup-card .content { font-size: 13px; color: #cbd5e1; line-height: 1.6; white-space: pre-wrap; }
        .empty-state { color: #475569; font-size: 13px; text-align: center; padding: 40px 20px; line-height: 1.8; }
    </style>
</head>
<body>
    <header>
        <h1>Dev Daily Agent</h1>
        <span class="badge">powered by Claude</span>
    </header>
    <div class="main">
        <div class="chat-panel">
            <div class="chat-messages" id="messages">
                <div class="message agent">Hi! I manage your tasks, track expenses, and generate standups. Try:
• "Add task: fix login bug — in progress"
• "Add expense: $200 client lunch"
• "Generate my standup for today"</div>
            </div>
            <div class="input-area">
                <div class="session-row">
                    <label>Session ID:</label>
                    <input class="session-input" id="sessionId" value="dev-session-1" type="text">
                </div>
                <div class="message-row">
                    <input class="message-input" id="messageInput" type="text"
                           placeholder='Try: "Generate my standup for today"'
                           onkeydown="if(event.key==='Enter') sendMessage()">
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
        <div class="standup-panel">
            <div class="standup-header">
                <h2>Standup History</h2>
                <button class="refresh-btn" onclick="loadHistory()">Refresh</button>
            </div>
            <div class="standup-list" id="standupList">
                <div class="empty-state">No standups yet.<br>Ask the agent to generate one!</div>
            </div>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const sessionId = document.getElementById('sessionId').value.trim();
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message || !sessionId) return;

            input.value = '';
            document.getElementById('sendBtn').disabled = true;

            appendMessage('user', message);
            const agentMsg = appendMessage('agent', '');

            try {
                const response = await fetch('/api/v1/agent/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionId, message })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();
                    for (const line of lines) {
                        if (line.startsWith('data:')) {
                            agentMsg.textContent += line.substring(5);
                            scrollToBottom();
                        }
                    }
                }
                if (buffer.startsWith('data:')) {
                    agentMsg.textContent += buffer.substring(5);
                    scrollToBottom();
                }
            } catch (e) {
                agentMsg.textContent = 'Error: ' + e.message;
            }

            document.getElementById('sendBtn').disabled = false;
            input.focus();
            await loadHistory();
        }

        function appendMessage(role, text) {
            const div = document.createElement('div');
            div.className = 'message ' + role;
            div.textContent = text;
            document.getElementById('messages').appendChild(div);
            scrollToBottom();
            return div;
        }

        function scrollToBottom() {
            const el = document.getElementById('messages');
            el.scrollTop = el.scrollHeight;
        }

        async function loadHistory() {
            const sessionId = document.getElementById('sessionId').value.trim();
            if (!sessionId) return;
            try {
                const response = await fetch('/api/v1/agent/standup/history?sessionId=' + encodeURIComponent(sessionId));
                const standups = await response.json();
                const list = document.getElementById('standupList');
                if (standups.length === 0) {
                    list.innerHTML = '<div class="empty-state">No standups yet.<br>Ask the agent to generate one!</div>';
                    return;
                }
                list.innerHTML = standups.map(s => `
                    <div class="standup-card">
                        <div class="date">${new Date(s.createdAt).toLocaleString()}</div>
                        <div class="content">${escapeHtml(s.content)}</div>
                    </div>
                `).join('');
            } catch (e) {
                console.error('Failed to load history:', e);
            }
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        loadHistory();
    </script>
</body>
</html>
