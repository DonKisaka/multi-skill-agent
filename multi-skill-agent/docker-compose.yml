services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=assistant_db'
      - 'POSTGRES_USER=assistant_user'
      - 'POSTGRES_PASSWORD=assistantuserpassword'
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: